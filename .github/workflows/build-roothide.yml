name: Build RootHide package

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "Package scheme"
        required: true
        default: roothide
        type: choice
        options:
          - roothide

permissions:
  contents: read

env:
  THEOS_PACKAGE_SCHEME: roothide
  ROOTHIDE_THEOS_SHA: 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
  SDK_REPOSITORY_SHA: 146e41ff2c292168388929e43c9b4de2f00e36b3
  SDK_RELEASE_TAG: master-146e41f
  SDK_RELEASE_COMMIT_SHA: 146e41ff2c292168388929e43c9b4de2f00e36b3
  SDK_NAME: iPhoneOS16.5.sdk
  SDK_ARCHIVE_SHA256: 5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb
  PACKAGE_VERSION: "0.0.9~diag1"

jobs:
  build-roothide:
    name: Build roothide
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify source and requested scheme
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.scheme }}" = "roothide"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          grep -Fqx "Version: ${PACKAGE_VERSION}" control
          grep -Fqx "PACKAGE_VERSION = ${PACKAGE_VERSION}" Makefile

      - name: Run source contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests -p 'test_*.py' -v

      - name: Inspect Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build utilities
        shell: bash
        run: |
          set -euo pipefail
          brew list --versions ldid >/dev/null 2>&1 || brew install ldid
          brew list --versions make >/dev/null 2>&1 || brew install make
          brew list --versions dpkg >/dev/null 2>&1 || brew install dpkg
          command -v ldid
          command -v gmake
          command -v dpkg-deb

      - name: Fetch pinned RootHide Theos and SDK
        shell: bash
        run: |
          set -euo pipefail
          theos_dir="$RUNNER_TEMP/roothide-theos"
          rm -rf "$theos_dir"
          git clone --recursive --no-tags https://github.com/roothide/theos.git "$theos_dir"
          git -C "$theos_dir" fetch --no-tags origin "$ROOTHIDE_THEOS_SHA"
          git -C "$theos_dir" checkout --detach "$ROOTHIDE_THEOS_SHA"
          git -C "$theos_dir" submodule update --init --recursive
          test "$(git -C "$theos_dir" rev-parse HEAD)" = "$ROOTHIDE_THEOS_SHA"
          test -f "$theos_dir/makefiles/common.mk"

          sdk_tag_head="$(git ls-remote https://github.com/theos/sdks.git "refs/tags/$SDK_RELEASE_TAG" | awk 'NR == 1 { print $1 }')"
          test "$sdk_tag_head" = "$SDK_REPOSITORY_SHA"
          test "$SDK_REPOSITORY_SHA" = "$SDK_RELEASE_COMMIT_SHA"

          mkdir -p "$theos_dir/sdks"
          sdk_archive="$RUNNER_TEMP/$SDK_NAME.tar.xz"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$sdk_archive" \
            "https://github.com/theos/sdks/releases/download/$SDK_RELEASE_TAG/$SDK_NAME.tar.xz"
          printf '%s  %s\n' "$SDK_ARCHIVE_SHA256" "$sdk_archive" | shasum -a 256 --check -
          tar -xJf "$sdk_archive" -C "$theos_dir/sdks"
          test -d "$theos_dir/sdks/$SDK_NAME"
          test -f "$theos_dir/sdks/$SDK_NAME/SDKSettings.plist"

          echo "THEOS=$theos_dir" >> "$GITHUB_ENV"
          echo "$theos_dir/bin" >> "$GITHUB_PATH"

      - name: Build roothide package
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          export SCHEME=roothide
          test "$THEOS_PACKAGE_SCHEME" = "$SCHEME"
          gmake clean package \
            FINALPACKAGE=1 \
            PACKAGE_VERSION="$PACKAGE_VERSION" \
            THEOS_PACKAGE_SCHEME="$SCHEME" \
            TARGET=iphone:clang:16.5:15.0 \
            ARCHS=arm64e \
            -j"$(sysctl -n hw.ncpu)"

      - name: Verify and stage package
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          artifact_dir="$RUNNER_TEMP/randomflip-artifact"
          extract_dir="$RUNNER_TEMP/randomflip-extracted"
          rm -rf "$artifact_dir" "$extract_dir"
          mkdir -p "$artifact_dir" "$extract_dir"

          deb_count="$(find packages -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d '[:space:]')"
          test "$deb_count" = 1
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"

          package_name="$(dpkg-deb -f "$deb" Package)"
          package_version="$(dpkg-deb -f "$deb" Version)"
          package_arch="$(dpkg-deb -f "$deb" Architecture)"
          package_maintainer="$(dpkg-deb -f "$deb" Maintainer)"
          package_author="$(dpkg-deb -f "$deb" Author)"
          package_icon="$(dpkg-deb -f "$deb" Icon)"
          package_depends="$(dpkg-deb -f "$deb" Depends)"
          package_description="$(dpkg-deb -f "$deb" Description)"
          package_section="$(dpkg-deb -f "$deb" Section)"
          package_depiction="$(dpkg-deb -f "$deb" SileoDepiction)"
          package_conflicts="$(dpkg-deb -f "$deb" Conflicts)"
          package_replaces="$(dpkg-deb -f "$deb" Replaces)"
          test "$package_name" = "com.tsangbaby.randomiconsflip"
          test "$package_version" = "$PACKAGE_VERSION"
          test "$package_arch" = "iphoneos-arm64e"
          test "$package_maintainer" = "Tsangbaby"
          test "$package_author" = "Tsangbaby"
          test "$package_icon" = "https://tsangbaby.github.io/Icon/RandomIconFlip.png"
          test "$package_depends" = "firmware (>= 15.0), mobilesubstrate"
          test "$package_description" = "Diagnostic build based on 0.0.8. Records bounded App-to-Home transition capability and lifecycle metadata without changing system animations."
          test "$package_section" = "Tweaks"
          test "$package_depiction" = "https://tsangbaby.github.io/depictions/com.tsangbaby.randomiconsflip/depiction.json"
          test "$package_conflicts" = "net.limneos.randomiconsflip"
          test "$package_replaces" = "net.limneos.randomiconsflip"

          dpkg-deb -I "$deb" > "$artifact_dir/PACKAGE_METADATA_FULL.txt"
          dpkg-deb -c "$deb" > "$artifact_dir/PACKAGE_CONTENTS_FULL.txt"
          dpkg-deb -x "$deb" "$extract_dir"
          test -f "$extract_dir/Library/MobileSubstrate/DynamicLibraries/RandomIconsFlip.dylib"
          test -f "$extract_dir/Library/MobileSubstrate/DynamicLibraries/RandomIconsFlip.plist"
          test ! -e "$extract_dir/var/jb"

          filter_plist="$extract_dir/Library/MobileSubstrate/DynamicLibraries/RandomIconsFlip.plist"
          python3 - "$filter_plist" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          with Path(sys.argv[1]).open("rb") as handle:
              value = plistlib.load(handle)
          expected = {"Filter": {"Bundles": ["com.apple.springboard"]}}
          if value != expected:
              raise SystemExit(f"unexpected injection filter: {value!r}")
          PY

          diagnostic_dylib="$extract_dir/Library/MobileSubstrate/DynamicLibraries/RandomIconsFlip.dylib"
          strings "$diagnostic_dylib" > "$RUNNER_TEMP/randomflip-dylib-strings.txt"
          grep -Fq '[RFAppToHomeDiag]' "$RUNNER_TEMP/randomflip-dylib-strings.txt"
          grep -Fq '0.0.9~diag1' "$RUNNER_TEMP/randomflip-dylib-strings.txt"
          grep -Fq '0.0.8' "$RUNNER_TEMP/randomflip-dylib-strings.txt"

          otool -L "$diagnostic_dylib" > "$artifact_dir/MACHO_DEPENDENCIES.txt"
          grep -Fq '@loader_path/.jbroot/usr/lib/libsubstrate.dylib' "$artifact_dir/MACHO_DEPENDENCIES.txt"
          ! grep -Fq '/var/jb/' "$artifact_dir/MACHO_DEPENDENCIES.txt"
          ! grep -Eq '^[[:space:]]+/usr/lib/libsubstrate\.dylib ' "$artifact_dir/MACHO_DEPENDENCIES.txt"
          ! grep -Fq '/Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate' "$artifact_dir/MACHO_DEPENDENCIES.txt"

          found_macho=0
          find "$extract_dir" -type f -print0 > "$RUNNER_TEMP/randomflip-files.list"
          while IFS= read -r -d '' candidate; do
            file_kind="$(file -b "$candidate")"
            case "$file_kind" in
              *Mach-O*)
                found_macho=1
                archs="$(lipo -archs "$candidate")"
                test "$archs" = "arm64e"
                ldid -e "$candidate" > /dev/null
                python3 tests/verify_macho_signature.py "$candidate" >> "$artifact_dir/MACHO_SIGNATURES.txt"
                ;;
            esac
          done < "$RUNNER_TEMP/randomflip-files.list"
          test "$found_macho" -gt 0
          test -s "$artifact_dir/MACHO_SIGNATURES.txt"

          cp "$deb" "$artifact_dir/"
          deb_basename="$(basename "$deb")"
          test "$deb_basename" = "com.tsangbaby.randomiconsflip_${PACKAGE_VERSION}_iphoneos-arm64e.deb"
          deb_sha256="$(shasum -a 256 "$deb" | awk '{ print $1 }')"
          printf '%s\n' "$GITHUB_SHA" > "$artifact_dir/SOURCE_COMMIT.txt"
          printf '%s  %s\n' "$deb_sha256" "$deb_basename" > "$artifact_dir/SHA256SUMS.txt"
          {
            printf 'Package: %s\n' "$package_name"
            printf 'Version: %s\n' "$package_version"
            printf 'Architecture: %s\n' "$package_arch"
            printf 'Maintainer: %s\n' "$package_maintainer"
            printf 'Author: %s\n' "$package_author"
            printf 'Icon: %s\n' "$package_icon"
            printf 'Conflicts: %s\n' "$package_conflicts"
            printf 'Replaces: %s\n' "$package_replaces"
            printf 'Build type: App-to-Home diagnostic\n'
            printf 'Baseline: 0.0.8\n'
            printf 'Theos: %s\n' "$ROOTHIDE_THEOS_SHA"
            printf 'SDK repository: %s\n' "$SDK_REPOSITORY_SHA"
            printf 'SDK release: %s\n' "$SDK_RELEASE_TAG"
            printf 'SDK: %s\n' "$SDK_NAME"
          } > "$artifact_dir/BUILD_INFO.txt"

          test "$(cat "$artifact_dir/SOURCE_COMMIT.txt")" = "$GITHUB_SHA"
          test "$(awk '{ print $1 }' "$artifact_dir/SHA256SUMS.txt")" = "$deb_sha256"
          (cd "$artifact_dir" && shasum -a 256 --check SHA256SUMS.txt)
          ls -l "$artifact_dir"

      - name: Upload RootHide artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: randomflip-roothide-${{ github.sha }}
          path: ${{ runner.temp }}/randomflip-artifact
          if-no-files-found: error
          retention-days: 7
